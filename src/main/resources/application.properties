spring.application.name=chess-coach

# По умолчанию только этот компьютер. Для игры по сети запускайте с SERVER_ADDRESS=0.0.0.0:
# чат тренера всё равно останется доступен только локально, потому что тратит деньги с вашего API-ключа.
server.address=127.0.0.1
server.port=8080

# Игроки, друзья, сессии и партии с людьми. Локально это файл H2, на сервере адрес PostgreSQL задаётся
# переменными SPRING_DATASOURCE_URL, _USERNAME и _PASSWORD.
spring.datasource.url=jdbc:h2:file:${user.home}/.chess-coach/db;MODE=PostgreSQL
spring.sql.init.mode=always

# Публичный сервер. Код-приглашение закрывает регистрацию; если он пуст, зарегистрироваться может любой.
online.invite-code=
# Партии с ботом и чат только после входа.
online.require-login=false
# Cookie только по HTTPS.
online.secure-cookie=false
# Чат только с этого компьютера. За прокси все запросы выглядят локальными, поэтому там нужен require-login.
coach.local-only=true
coach.max-questions-per-hour=60

# Анализ ходов игрока.
analysis.depth=7
analysis.time-limit-ms=1500
# На один ход при разборе законченной партии с человеком.
analysis.report-time-limit-ms=700

# Кто отвечает за тренера: auto (сначала OpenAI, затем Claude, смотря какой ключ задан), openai, anthropic.
coach.provider=auto

# OpenAI: ключ в OPENAI_API_KEY, адрес другого сервиса можно задать в OPENAI_BASE_URL.
coach.openai.model=gpt-4o-mini

# Claude: ключ в ANTHROPIC_API_KEY. Глубина размышлений: low, medium, high, xhigh, max.
coach.anthropic.model=claude-opus-5-5
coach.anthropic.effort=medium
coach.anthropic.max-tokens=64000
